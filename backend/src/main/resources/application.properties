spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/skybook
spring.datasource.username=skybook
spring.datasource.password=skybook

# Learning-mode only: Hibernate creates/updates tables from your entities.
# In production you'd use 'validate' + a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Don't keep a DB session open during view rendering (see Step 1: lazy loading)
spring.jpa.open-in-view=false

# Never send Java stack traces to clients (DevTools turns them on in development by default)
server.error.include-stacktrace=never
