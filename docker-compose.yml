# Daily development:  docker compose up -d                       -> Postgres only (run apps from IntelliJ / npm run dev)
# Full stack:         docker compose --profile app up -d --build  -> Postgres + backend + frontend in containers

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: skybook
      POSTGRES_USER: skybook
      POSTGRES_PASSWORD: skybook
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql
      # (older versions used /var/lib/postgresql/data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybook -d skybook"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      # Spring Boot maps env vars onto properties: SPRING_DATASOURCE_URL -> spring.datasource.url.
      # Inside the Compose network, the database host is the service name "postgres", not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skybook
      SPRING_DATASOURCE_USERNAME: skybook
      SPRING_DATASOURCE_PASSWORD: skybook
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    environment:
      # Server-side calls from Next.js to Spring Boot go over the Compose network
      API_BASE_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
